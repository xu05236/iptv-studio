name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/worker/**'
      - 'packages/core/**'
      - 'packages/runner/**'
      - 'scripts/**'
      - 'apps/web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'

concurrency:
  group: iptv-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck & test
        id: checks
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          npm test 2>&1 | tee /tmp/checks.log || status=1
          npm run typecheck 2>&1 | tee -a /tmp/checks.log || status=1
          exit $status

      - name: Build web
        id: build
        if: steps.checks.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log

      - name: Stamp build version
        run: node scripts/stamp-version.mjs
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Sync migration manifest
        run: node scripts/gen-migrations.mjs

      - name: Apply D1 migrations
        id: migrate
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npm run db:migrate -w @iptv/worker 2>&1 | tee /tmp/migrate.log

      - name: Deploy
        id: deploy
        if: steps.migrate.outcome == 'success'
        timeout-minutes: 10
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          command: deploy

      - name: Smoke test
        id: smoke
        if: steps.deploy.outcome == 'success'
        env:
          SMOKE_BASE: https://iptv.xu05236.dpdns.org
        run: node scripts/smoke.mjs

      - name: Report failure to the admin inbox
        if: always() && (steps.checks.outcome == 'failure' || steps.build.outcome == 'failure' || steps.migrate.outcome == 'failure' || steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          SITE: https://iptv.xu05236.dpdns.org
        run: |
          msg=""
          for f in checks build migrate deploy; do
            if [ -f "/tmp/$f.log" ]; then
              line=$(grep -m 3 -E 'ERROR|✘' "/tmp/$f.log" | tail -n 3 | tr '\n' ' ' | tr -d '"' | cut -c1-200)
              msg="$msg [$f] $line"
            fi
          done
          curl -s --max-time 20 -X POST "$SITE/api/public/feedback" \
            -H 'content-type: application/json' \
            --data-binary "{\"channelId\":\"ci-deploy\",\"entryKey\":\"ci-deploy\",\"kind\":\"ci\",\"message\":\"${msg:0:480}\"}" || true

      - name: Mark the run failed
        if: always() && (steps.checks.outcome == 'failure' || steps.build.outcome == 'failure' || steps.migrate.outcome == 'failure' || steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        run: exit 1
