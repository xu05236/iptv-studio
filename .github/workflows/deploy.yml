name: Deploy Worker

on:
  # Manual by default: the first deployment is done from the local machine via
  # `wrangler login`. Add CLOUDFLARE_API_TOKEN/ACCOUNT_ID secrets and re-enable
  # the push trigger if you want CI deployments later.
  workflow_dispatch:

concurrency:
  group: iptv-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck & test
        run: |
          npm run typecheck
          npm test

      - name: Build web
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/worker
          command: deploy
