name: Collect
run-name: "IPTV ${{ inputs.command || 'collect' }} ${{ inputs.task_id || '' }}"

on:
  # Automatic collection is intentionally disabled. Run manually when the KV
  # budget and the current test plan allow it.
  workflow_dispatch:
    inputs:
      command:
        description: 'collect=全流程，fetch=只抓源，probe=只测速，probe-batch=分批探测，publish=只发布，export=重建导出，epg=只更新节目单，liveness=池内测活，probe-lines=指定线路探测'
        type: choice
        options: [collect, fetch, probe, probe-batch, publish, export, epg, liveness, probe-lines, cleanup-orphans]
        default: collect
      budget:
        description: '本次测速条数（首轮建议 1200，稳定后再调大）'
        default: '1200'
      force:
        description: '强制全量测速（忽略 TTL 到期时间，配合 budget 使用）'
        type: choice
        options: ['false', 'true']
        default: 'false'
      source_id:
        description: '仅检测指定采集站 ID（留空=全部）'
        default: ''
      line_keys:
        description: '仅探测指定线路 key（逗号分隔，检测中心勾选用）'
        default: ''
      phase:
        description: '分批探测指定阶段：pending / quarantine / rejected（留空按后台顺序）'
        default: ''
      task_id:
        description: '全局任务队列 id（内部使用，手动触发留空）'
        default: ''
      auto_publish:
        description: '自动发布标记（内部使用）'
        default: ''
      trigger:
        description: '任务来源：schedule / manual（内部使用）'
        default: 'manual'

concurrency:
  group: iptv-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure ffmpeg/ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Run pipeline
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_BUDGET: ${{ github.event.inputs.budget || vars.PROBE_BUDGET || '6000' }}
          PROBE_FORCE: ${{ github.event.inputs.force || 'false' }}
          SOURCE_ID: ${{ github.event.inputs.source_id || '' }}
          LINE_KEYS: ${{ github.event.inputs.line_keys || '' }}
          PROBE_PHASE: ${{ github.event.inputs.phase || '' }}
          TASK_ID: ${{ github.event.inputs.task_id || '' }}
          AUTO_PUBLISH: ${{ github.event.inputs.auto_publish || '' }}
          TRIGGER: ${{ github.event.inputs.trigger || 'manual' }}
        run: |
          if [ "${{ github.event.inputs.command || 'collect' }}" = "export" ]; then
            npm run export -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "epg" ]; then
            npm run epg -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "fetch" ]; then
            npm run fetch -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "probe" ]; then
            npm run probe -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "probe-batch" ]; then
            npm run probe-batch -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "publish" ]; then
            npm run publish -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "liveness" ]; then
            npm run liveness -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "probe-lines" ]; then
            npm run probe-lines -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "cleanup-orphans" ]; then
            npm run cleanup-orphans -w @iptv/runner
          else
            npm run collect -w @iptv/runner
          fi

      - name: Capture screenshots (optional)
        if: github.event.inputs.command == 'collect' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SHOT_LIMIT: ${{ vars.SHOT_LIMIT || '60' }}
        run: npm run shots -w @iptv/runner

      - name: Upload runner log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runner-log
          path: |
            .tmp/*.log
          if-no-files-found: ignore
