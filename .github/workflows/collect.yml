name: Collect & Probe

on:
  schedule:
    # 00:30 UTC = 08:30 Asia/Shanghai, after the KV/D1 UTC reset at 08:00.
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: 'collect = 抓取+测速+发布，export = 只重建导出，epg = 只更新节目单'
        type: choice
        options: [collect, export, epg]
        default: collect
      budget:
        description: '本次测速条数（首轮建议 1200，稳定后再调大）'
        default: '1200'
      force:
        description: '强制全量测速（忽略 TTL 到期时间，配合 budget 使用）'
        type: choice
        options: ['false', 'true']
        default: 'false'
      source_id:
        description: '仅检测指定采集站 ID（留空=全部）'
        default: ''

concurrency:
  group: iptv-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure ffmpeg/ffprobe
        run: |
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffprobe -version | head -1

      - name: Run pipeline
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PROBE_BUDGET: ${{ github.event.inputs.budget || vars.PROBE_BUDGET || '6000' }}
          PROBE_CONCURRENCY: ${{ vars.PROBE_CONCURRENCY || '32' }}
          PROBE_FORCE: ${{ github.event.inputs.force || 'false' }}
          SOURCE_ID: ${{ github.event.inputs.source_id || '' }}
          PUBLISH_COOLDOWN_MS: '60000'
          FFPROBE_LIMIT: ${{ vars.FFPROBE_LIMIT || '150' }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          if [ "${{ github.event.inputs.command || 'collect' }}" = "export" ]; then
            npm run export -w @iptv/runner
          elif [ "${{ github.event.inputs.command || 'collect' }}" = "epg" ]; then
            npm run epg -w @iptv/runner
          else
            npm run collect -w @iptv/runner
          fi

      - name: Capture screenshots (optional)
        if: github.event.inputs.command == 'collect' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          SHOT_LIMIT: ${{ vars.SHOT_LIMIT || '60' }}
        run: npm run shots -w @iptv/runner

      - name: Upload runner log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runner-log
          path: |
            .tmp/*.log
          if-no-files-found: ignore
