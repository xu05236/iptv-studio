name: tmp-proxy-check

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reachability probe
        run: |
          echo "== tcp =="
          timeout 10 bash -c 'cat < /dev/null > /dev/tcp/47.108.144.102/1080' && echo tcp_ok || echo tcp_fail
          echo "== http proxy handshake =="
          curl -sS -m 15 -o /dev/null -w "code=%{http_code}\n" -x http://47.108.144.102:1080 http://example.com || echo curl_fail
          echo "== done =="
