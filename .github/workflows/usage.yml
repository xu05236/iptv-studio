name: Usage snapshot

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: iptv-usage
  cancel-in-progress: true

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Snapshot usage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_ID: da4e65ee-de99-455e-88ed-eb06d10cd139
          KV_ID: d4fc0301922746df8af08e288172c1c4
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: xu05236/iptv-studio
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: npm run usage -w @iptv/runner
