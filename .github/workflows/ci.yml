name: CI

on:
  pull_request:
  workflow_dispatch:

# Push to main is already validated by deploy.yml (typecheck + test + build run
# before deploying). Keeping a second push workflow would spend the free
# 2,000 Actions minutes/month twice for the same commit.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
